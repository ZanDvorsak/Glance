name: CI

# Builds everything and runs the unit tests on every push and pull request.
# Hardware-dependent behaviour (the real display, sensors, drivers) cannot be tested here and is verified by hand.
on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build src/Glance.sln -c Release

      - name: Test
        run: dotnet test src/Glance.Tests -c Release --no-build --logger "console;verbosity=normal"
